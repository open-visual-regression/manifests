# existingSecret supplies DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET,
# OVR_GIT_TOKEN_ENCRYPTION_KEY, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY.
# Created out-of-band by scripts/create-secrets.sh — never commit it.
existingSecret: ovr-secrets

image:
  tag: main
  # main is a moving tag; IfNotPresent would never repull it.
  pullPolicy: Always

env:
  baseUrl: "https://openvisualregression.com"

database:
  url: "" # unused, see existingSecret

redis:
  url: "" # unused, see existingSecret

storage:
  # empty endpoint/publicEndpoint + forcePathStyle: false = real AWS S3
  endpoint: ""
  publicEndpoint: ""
  region: us-east-1 # match the bucket's region
  bucket: open-visual-regression
  forcePathStyle: false
  # accessKey/secretKey unused, see existingSecret

# Two nodes: the 2GB control-plane node "vultr" runs web, valkey and all the
# system pods; the 1GB node "vultr-worker" runs only the capture worker, which
# is pinned there (nodeSelector + toleration below). See README.md "Resource
# budget is tight" before raising anything.
web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: 500m, memory: 320Mi }
  # The control-plane node has real headroom now that the worker is on its own
  # node, so zero-downtime rollouts are worth it here. The worker stays on
  # Recreate (chart default) — its node has no spare room for a second replica.
  updateStrategy: RollingUpdate
  ingress:
    enabled: true
    className: traefik
    host: openvisualregression.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - hosts: [openvisualregression.com]
        secretName: ovr-tls

worker:
  replicas: 1
  # Headless Chromium is the biggest memory consumer here; keep concurrency low.
  concurrency: 1
  # Snapshots per group, at 2 minutes each: caps a stuck group at ~8 minutes.
  groupSize: 4
  # Pinned to the dedicated 1GB node, whose taint keeps everything else off it,
  # so capture load stays isolated from the API server, CoreDNS and ingress.
  nodeSelector:
    ovr.io/role: worker
  tolerations:
    - key: ovr.io/dedicated
      operator: Equal
      value: worker
      effect: NoSchedule
  # The node reserves 350Mi for k3s itself, leaving ~600Mi allocatable. The CPU
  # limit still leaves ~150m for the node's own kubelet under full capture load.
  resources:
    requests: { cpu: 300m, memory: 400Mi }
    limits: { cpu: 850m, memory: 550Mi }
  # Counts against the container's memory limit, so keep it modest.
  shmSize: 256Mi

migrate:
  enabled: true
