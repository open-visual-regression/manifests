{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ovr.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "ovr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "ovr.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "migrate") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "ovr.image" (dict "Values" .Values "name" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "ovr.fullname" . }}-config
            - secretRef:
                name: {{ include "ovr.secretName" . }}
{{- end }}
