{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ovr.secretName" . }}
  labels:
    {{- include "ovr.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  BETTER_AUTH_SECRET: {{ .Values.auth.betterAuthSecret | quote }}
  OVR_GIT_TOKEN_ENCRYPTION_KEY: {{ .Values.auth.gitTokenEncryptionKey | quote }}
  STORAGE_ACCESS_KEY: {{ .Values.storage.accessKey | quote }}
  STORAGE_SECRET_KEY: {{ .Values.storage.secretKey | quote }}
{{- end }}
