# existingSecret supplies DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET,
# OVR_GIT_TOKEN_ENCRYPTION_KEY, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY.
# Created out-of-band by scripts/create-secrets.sh — never commit it.
existingSecret: ovr-secrets

image:
  tag: main
  # main is a moving tag; IfNotPresent would never repull it.
  pullPolicy: Always

env:
  baseUrl: "https://openvisualregression.com"

database:
  url: "" # unused, see existingSecret

redis:
  url: "" # unused, see existingSecret

storage:
  # empty endpoint/publicEndpoint + forcePathStyle: false = real AWS S3
  endpoint: ""
  publicEndpoint: ""
  region: us-east-1 # match the bucket's region
  bucket: open-visual-regression
  forcePathStyle: false
  # accessKey/secretKey unused, see existingSecret

# Two nodes: the 4GB control-plane node "web" runs web, valkey and all the
# system pods; the 4GB node "worker" runs only the capture worker, which is
# pinned there (nodeSelector + toleration below). See README.md "Resource
# budget is tight" before raising anything.
web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: 500m, memory: 320Mi }
  # Both nodes have real headroom now, so zero-downtime rollouts are worth it
  # on both — see the matching updateStrategy under worker below.
  updateStrategy: RollingUpdate
  ingress:
    enabled: true
    className: traefik
    host: openvisualregression.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - hosts: [openvisualregression.com]
        secretName: ovr-tls

worker:
  replicas: 1
  # Headless Chromium is the biggest memory consumer here; keep concurrency low.
  concurrency: 1
  # Snapshots per group, at 2 minutes each: caps a stuck group at ~8 minutes.
  groupSize: 4
  # Pinned to the dedicated worker node, whose taint keeps everything else off
  # it, so capture load stays isolated from the API server, CoreDNS and ingress.
  nodeSelector:
    ovr.io/role: worker
  tolerations:
    - key: ovr.io/dedicated
      operator: Equal
      value: worker
      effect: NoSchedule
  # The node has real headroom (4GB), so a brief old+new pod overlap during a
  # rollout fits comfortably — BullMQ's per-job locking means the two workers
  # sharing the queue mid-rollout is safe, not a double-processing risk.
  updateStrategy: RollingUpdate
  # The node reserves 350Mi for k3s itself, leaving ~3.4Gi allocatable. Still
  # conservative relative to what's actually available now.
  resources:
    requests: { cpu: 300m, memory: 400Mi }
    limits: { cpu: 850m, memory: 550Mi }
  # Counts against the container's memory limit, so keep it modest.
  shmSize: 256Mi

migrate:
  enabled: true
