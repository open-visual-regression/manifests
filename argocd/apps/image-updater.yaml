apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ovr-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.2.4
    helm:
      values: |
        config:
          registries:
            - name: GHCR
              api_url: https://ghcr.io
              prefix: ghcr.io
              ping: no
        extraObjects:
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: ovr-app
              namespace: argocd
            spec:
              commonUpdateSettings:
                updateStrategy: digest
              writeBackConfig:
                method: argocd
              applicationRefs:
                - namePattern: "ovr-app"
                  images:
                    - alias: web
                      imageName: ghcr.io/open-visual-regression/web:main
                      manifestTargets:
                        helm:
                          spec: "web.image.override"
                    - alias: worker
                      imageName: ghcr.io/open-visual-regression/worker:main
                      manifestTargets:
                        helm:
                          spec: "worker.image.override"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
